<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products · HassDent Dental Supplies</title>
  <link rel="icon" type="image/png" href="/img/favicon.png">
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/phosphor/duotone.css">
  <link rel="stylesheet" href="/vendor/phosphor/bold.css">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/shell.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  <link rel="stylesheet" href="/css/products.css">
</head>
<body data-page="products">
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="sb-scrim" id="sb-scrim"></div>
  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu"><i class="ph-duotone ph-list"></i></button>
      <div class="title"><h1>Products</h1><div class="sub">Prices, minimum prices and stock at a glance</div></div>
      <div class="actions">
        <div class="dropdown">
          <button class="icon-btn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-label="Notifications">
            <i class="ph-duotone ph-bell"></i><span class="dot" id="notif-dot" hidden>0</span></button>
          <div class="dropdown-menu dropdown-menu-end notif-menu">
            <div class="notif-head"><b>Notifications</b><button type="button" id="notif-readall" hidden>Mark all as read</button></div>
            <div class="notif-list" id="notif-list"></div>
          </div>
        </div>
        <button class="btn-cta border-0" id="add-product" type="button" data-perm="products.manage">
          <span class="txt">Add product</span><span class="plus"><i class="ph-bold ph-plus"></i></span>
        </button>
      </div>
    </header>

    <div class="card-hd">
      <div class="card-title-row">
        <h2>All products</h2><span class="count-pill" id="p-count">0</span>
      </div>
      <div class="pos-search mb-3"><i class="ph-duotone ph-magnifying-glass"></i>
        <input id="p-q" class="form-control" type="search" placeholder="Search by name, SKU or barcode…" autocomplete="off">
      </div>
      <div class="table-responsive">
        <table class="table prod-table align-middle mb-0">
          <thead><tr>
            <th>Product</th><th class="d-none d-md-table-cell">Category</th>
            <th class="text-end cost-col" data-perm="products.manage">Cost</th>
            <th class="text-end">Price</th><th class="text-end">Min price</th>
            <th class="text-end">Stock</th><th></th>
          </tr></thead>
          <tbody id="p-body"><tr><td colspan="7"><div class="state-box"><i class="ph-duotone ph-circle-notch"></i><div>Loading…</div></div></td></tr></tbody>
        </table>
      </div>
      <div class="d-flex justify-content-between align-items-center mt-3" id="p-pager" hidden>
        <button class="btn btn-sm btn-light fw-bold" id="p-prev" type="button">&larr; Previous</button>
        <span class="small text-muted fw-semibold" id="p-page"></span>
        <button class="btn btn-sm btn-light fw-bold" id="p-next" type="button">Next &rarr;</button>
      </div>
    </div>
  </div>
</div>

<!-- add / edit product modal -->
<div class="modal fade" id="prodModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"><div class="modal-content pay-modal">
    <div class="modal-body p-4">
      <div class="d-flex justify-content-between align-items-start mb-3">
        <h2 class="h5 fw-bold mb-0" id="f-title">Add product</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="hd-alert hd-alert-danger mb-3" id="f-err" hidden><i class="ph-duotone ph-warning-circle"></i><span></span></div>

      <div class="row g-3">
        <div class="col-12 col-md-8">
          <label class="hd-label" for="f-name">Product name *</label>
          <input id="f-name" class="form-control" type="text" maxlength="200" autocomplete="off">
        </div>
        <div class="col-6 col-md-4">
          <label class="hd-label" for="f-sku">SKU *</label>
          <input id="f-sku" class="form-control" type="text" maxlength="50" autocomplete="off">
        </div>
        <div class="col-6 col-md-4">
          <label class="hd-label" for="f-barcode">Barcode</label>
          <input id="f-barcode" class="form-control" type="text" maxlength="64" autocomplete="off">
        </div>
        <div class="col-6 col-md-4">
          <label class="hd-label" for="f-category">Category</label>
          <select id="f-category" class="form-select"><option value="">None</option></select>
        </div>
        <div class="col-6 col-md-4">
          <label class="hd-label" for="f-brand">Brand</label>
          <select id="f-brand" class="form-select"><option value="">None</option></select>
        </div>
        <div class="col-6 col-md-4">
          <label class="hd-label" for="f-unit">Unit *</label>
          <select id="f-unit" class="form-select"></select>
        </div>

        <div class="col-12"><div class="price-box">
          <div class="row g-3">
            <div class="col-12 col-md-4">
              <label class="hd-label" for="f-cost">Cost price (KES)</label>
              <input id="f-cost" class="form-control" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
            </div>
            <div class="col-6 col-md-4">
              <label class="hd-label" for="f-price">Selling price (KES)</label>
              <input id="f-price" class="form-control" type="number" min="0" step="0.01" inputmode="decimal" placeholder="0.00">
            </div>
            <div class="col-6 col-md-4">
              <label class="hd-label" for="f-min">Minimum price (KES)</label>
              <input id="f-min" class="form-control" type="number" min="0" step="0.01" inputmode="decimal" placeholder="No floor">
            </div>
          </div>
          <div class="price-hint" id="f-hint"></div>
        </div></div>

        <div class="col-6 col-md-4">
          <label class="hd-label" for="f-reorder">Reorder level</label>
          <input id="f-reorder" class="form-control" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
        </div>
        <div class="col-6 col-md-4" id="f-open-wrap">
          <label class="hd-label" for="f-open">Opening stock</label>
          <input id="f-open" class="form-control" type="number" min="0" step="1" inputmode="numeric" placeholder="0">
        </div>
        <div class="col-12 col-md-4 d-flex align-items-end">
          <div class="form-check mb-2">
            <input class="form-check-input" type="checkbox" id="f-expiry">
            <label class="form-check-label fw-semibold" for="f-expiry">Tracks expiry dates</label>
          </div>
        </div>
      </div>

      <button class="btn btn-hd btn-lg w-100 mt-4" id="f-save" type="button"><span class="label">Save product</span></button>
    </div>
  </div></div>
</div>

<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/shell.js"></script>
<script src="/js/products.js"></script>
</body>
</html>
