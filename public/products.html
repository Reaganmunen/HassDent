<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Products · HassDent Dental Supplies</title>
  <meta name="theme-color" content="#1a1a1c">
  <link rel="icon" type="image/png" href="/img/favicon.png">

  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/phosphor/duotone.css">
  <link rel="stylesheet" href="vendor/phosphor/bold.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/products.css">
</head>
<body data-page="products">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="sb-scrim" id="sb-scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu"><i class="ph-duotone ph-list"></i></button>
        <div class="title">
          <h1>Products</h1>
          <div class="sub" id="sub">&nbsp;</div>
        </div>
        <div class="actions">
          <button class="icon-btn" id="btn-refresh" type="button" title="Refresh" aria-label="Refresh"><i class="ph-duotone ph-arrows-clockwise"></i></button>
          <div class="dropdown">
            <button class="icon-btn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Notifications">
              <i class="ph-duotone ph-bell"></i><span class="dot" id="notif-dot" hidden>0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end notif-menu">
              <div class="notif-head"><b>Notifications</b><button type="button" id="notif-readall" hidden>Mark all as read</button></div>
              <div class="notif-list" id="notif-list"><div class="notif-empty">Loading…</div></div>
            </div>
          </div>
          <button class="btn-cta" id="btn-add" type="button" data-perm="products.manage">
            <span class="txt">Add product</span><span class="plus"><i class="ph-bold ph-plus"></i></span>
          </button>
        </div>
      </header>

      <div class="card-hd">
        <div class="filters">
          <div class="hd-field search">
            <i class="ph-duotone ph-magnifying-glass field-icon"></i>
            <input class="form-control" id="f-search" type="search" placeholder="Search name, SKU or barcode" autocomplete="off">
          </div>
          <select class="form-select" id="f-category" aria-label="Category"><option value="">All categories</option></select>
          <select class="form-select" id="f-brand" aria-label="Brand"><option value="">All brands</option></select>
          <div class="seg" id="f-status" role="group" aria-label="Status">
            <button type="button" data-v="" class="on">Active</button>
            <button type="button" data-v="false">Inactive</button>
            <button type="button" data-v="all">All</button>
          </div>
          <div class="form-check form-switch m-0"><input class="form-check-input" type="checkbox" id="f-low"><label class="form-check-label" for="f-low">Low stock</label></div>
        </div>
        <div id="list"><div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-line"></div></div>
        <div class="pager" id="pager" hidden></div>
      </div>
    </div>
  </div>

  <!-- product detail drawer -->
  <div class="offcanvas offcanvas-end" tabindex="-1" id="drawer" aria-labelledby="drawer-title">
    <div class="offcanvas-header">
      <h2 class="offcanvas-title" id="drawer-title">Product</h2>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body" id="drawer-body"></div>
  </div>

  <!-- add / edit modal -->
  <div class="modal fade" id="pModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"><div class="modal-content">
      <form id="p-form" novalidate>
        <div class="modal-header"><h2 class="modal-title" id="p-title">Add product</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <div class="hd-alert hd-alert-danger mb-3" id="p-error" hidden><i class="ph-duotone ph-warning-circle"></i><span></span></div>
          <div class="row g-3">
            <div class="col-md-8"><label class="hd-label" for="p-name">Name *</label><input class="form-control" id="p-name" maxlength="200" required></div>
            <div class="col-md-4"><label class="hd-label" for="p-sku">SKU *</label><input class="form-control" id="p-sku" maxlength="50" required></div>
            <div class="col-md-4"><label class="hd-label" for="p-barcode">Barcode</label><input class="form-control" id="p-barcode" maxlength="64"></div>
            <div class="col-md-4"><label class="hd-label" for="p-category">Category</label><select class="form-select" id="p-category"><option value="">None</option></select></div>
            <div class="col-md-4"><label class="hd-label" for="p-brand">Brand</label><select class="form-select" id="p-brand"><option value="">None</option></select></div>
            <div class="col-md-4"><label class="hd-label" for="p-unit">Unit *</label><select class="form-select" id="p-unit" required></select></div>
            <div class="col-md-4"><label class="hd-label" for="p-tax">Tax rate</label><select class="form-select" id="p-tax"></select></div>
            <div class="col-md-4"><label class="hd-label" for="p-cost">Cost price (KES)</label><input class="form-control" id="p-cost" type="number" min="0" step="0.01"></div>
            <div class="col-md-4"><label class="hd-label" for="p-price">Selling price (KES)</label><input class="form-control" id="p-price" type="number" min="0" step="0.01"></div>
            <div class="col-md-4"><label class="hd-label" for="p-min">Minimum price</label><input class="form-control" id="p-min" type="number" min="0" step="0.01" placeholder="No floor"></div>
            <div class="col-md-4"><label class="hd-label" for="p-reorder">Reorder level</label><input class="form-control" id="p-reorder" type="number" min="0" step="1"></div>
            <div class="col-md-4"><label class="hd-label" for="p-reorderqty">Reorder quantity</label><input class="form-control" id="p-reorderqty" type="number" min="0" step="1"></div>
            <div class="col-md-4" id="p-open-wrap"><label class="hd-label" for="p-open">Opening stock</label><input class="form-control" id="p-open" type="number" min="0" step="1" value="0"></div>
            <div class="col-12"><label class="hd-label" for="p-desc">Description</label><textarea class="form-control" id="p-desc" rows="2"></textarea></div>
            <div class="col-12"><div class="form-check"><input class="form-check-input" type="checkbox" id="p-expiry"><label class="form-check-label" for="p-expiry">Track batches and expiry dates <span class="text-muted">(stock is then received through a goods-received note)</span></label></div></div>
          </div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-hd" id="p-save">Save product</button></div>
      </form>
    </div></div>
  </div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/product.js"></script>
</body>
</html>
