<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reports · HassDent Dental Supplies</title>
  <meta name="theme-color" content="#1a1a1c">
  <link rel="icon" type="image/png" href="img/favicon.png">

  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/phosphor/duotone.css">
  <link rel="stylesheet" href="vendor/phosphor/bold.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/reports.css">
</head>
<body data-page="reports">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="sb-scrim" id="sb-scrim"></div>

    <div class="main">
      <!-- ============ Top bar ============ -->
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu"><i class="ph-duotone ph-list"></i></button>
        <div class="title">
          <h1>Reports</h1>
          <div class="sub" id="greeting">&nbsp;</div>
        </div>
        <div class="actions">
          <button class="icon-btn" id="btn-refresh" type="button" title="Refresh" aria-label="Refresh data"><i class="ph-duotone ph-arrows-clockwise"></i></button>
          <button class="icon-btn" id="btn-print" type="button" title="Print this page" aria-label="Print"><i class="ph-duotone ph-printer"></i></button>

          <div class="dropdown">
            <button class="icon-btn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Notifications">
              <i class="ph-duotone ph-bell"></i><span class="dot" id="notif-dot" hidden>0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end notif-menu">
              <div class="notif-head"><b>Notifications</b><button type="button" id="notif-readall" hidden>Mark all as read</button></div>
              <div class="notif-list" id="notif-list"><div class="notif-empty">Loading…</div></div>
            </div>
          </div>

          <a class="btn-cta" href="pos.html" data-perm="sales.create">
            <span class="txt">New Sale</span><span class="plus"><i class="ph-bold ph-plus"></i></span>
          </a>
        </div>
      </header>

      <!-- ============ Content ============ -->
      <div class="row grid-gap">

        <!-- ===== Range bar ===== -->
        <div class="col-12">
          <div class="card-hd range-bar">
            <div class="range-presets" id="range-presets" role="group" aria-label="Date presets">
              <button type="button" data-preset="7">7 days</button>
              <button type="button" data-preset="30" class="on">30 days</button>
              <button type="button" data-preset="90">90 days</button>
              <button type="button" data-preset="mtd">This month</button>
              <button type="button" data-preset="last-month">Last month</button>
              <button type="button" data-preset="ytd">Year to date</button>
            </div>
            <div class="range-custom">
              <div class="field-inline">
                <label for="range-from">From</label>
                <input type="date" id="range-from">
              </div>
              <span class="range-dash">→</span>
              <div class="field-inline">
                <label for="range-to">To</label>
                <input type="date" id="range-to">
              </div>
              <button class="btn-primary-custom btn-sm" id="btn-apply-range" type="button">
                <i class="ph-bold ph-funnel"></i> Apply
              </button>
            </div>
            <div class="range-label" id="range-label">—</div>
          </div>
        </div>

        <!-- ===== KPI strip ===== -->
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card-hd stat dark">
            <div class="top"><span class="s-ico"><i class="ph-duotone ph-coins"></i></span><span class="s-label">Net sales</span></div>
            <div class="s-value sk" id="kpi-net" data-v>KES 0</div>
            <div class="s-foot sk" id="kpi-net-foot">Gross minus refunds</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card-hd stat">
            <div class="top"><span class="s-ico"><i class="ph-duotone ph-receipt"></i></span><span class="s-label">Orders</span></div>
            <div class="s-value sk" id="kpi-orders">0</div>
            <div class="s-foot" id="kpi-orders-foot">—</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card-hd stat amber">
            <div class="top"><span class="s-ico"><i class="ph-duotone ph-trend-up"></i></span><span class="s-label">Est. gross profit</span></div>
            <div class="s-value sk" id="kpi-profit">KES 0</div>
            <div class="s-foot" id="kpi-profit-foot">Margins minus discounts</div>
          </div>
        </div>
        <div class="col-12 col-sm-6 col-xl-3">
          <div class="card-hd stat sky">
            <div class="top"><span class="s-ico"><i class="ph-duotone ph-hand-coins"></i></span><span class="s-label">Est. net profit</span></div>
            <div class="s-value sk" id="kpi-net-profit">KES 0</div>
            <div class="s-foot" id="kpi-net-profit-foot">After expenses</div>
          </div>
        </div>

        <!-- ===== Sales trend (line) ===== -->
        <div class="col-12 col-xl-8">
          <div class="card-hd">
            <div class="card-title-row">
              <h2>Sales trend</h2>
              <div class="seg" id="trend-metric" role="group" aria-label="Metric">
                <button type="button" data-metric="sales" class="on">Gross sales</button>
                <button type="button" data-metric="profit">Gross profit</button>
                <button type="button" data-metric="count">Orders</button>
              </div>
              <button class="export-btn" data-export="trend" type="button" title="Download CSV">
                <i class="ph-duotone ph-download-simple"></i> CSV
              </button>
            </div>
            <div id="trend-kpis" class="chart-kpis"></div>
            <div id="trend-box" class="chart-box"><div class="sk sk-line" style="height:230px;margin:6px 0"></div></div>
          </div>
        </div>

        <!-- ===== Payment methods (donut) ===== -->
        <div class="col-12 col-md-6 col-xl-4">
          <div class="card-hd">
            <div class="card-title-row">
              <h2>Payment methods</h2>
              <button class="export-btn" data-export="payments" type="button" title="Download CSV">
                <i class="ph-duotone ph-download-simple"></i> CSV
              </button>
            </div>
            <div id="pay-body"><div class="sk sk-line" style="height:170px;width:170px;border-radius:50%;margin:8px auto"></div></div>
          </div>
        </div>

        <!-- ===== Top products (bar chart) ===== -->
        <div class="col-12 col-xl-7">
          <div class="card-hd">
            <div class="card-title-row">
              <h2>Top products</h2>
              <div class="seg" id="top-metric" role="group" aria-label="Rank by">
                <button type="button" data-by="revenue" class="on">Revenue</button>
                <button type="button" data-by="quantity">Units</button>
              </div>
              <button class="export-btn" data-export="top" type="button" title="Download CSV">
                <i class="ph-duotone ph-download-simple"></i> CSV
              </button>
            </div>
            <div id="top-body"><div class="sk sk-line" style="height:240px"></div></div>
          </div>
        </div>

        <!-- ===== Top customers (table) ===== -->
        <div class="col-12 col-xl-5">
          <div class="card-hd">
            <div class="card-title-row">
              <h2>Top customers</h2>
              <button class="export-btn" data-export="customers" type="button" title="Download CSV">
                <i class="ph-duotone ph-download-simple"></i> CSV
              </button>
            </div>
            <div id="cust-body"><div class="sk sk-line"></div><div class="sk sk-line"></div><div class="sk sk-line"></div></div>
          </div>
        </div>

        <!-- ===== P&L summary ===== -->
        <div class="col-12">
          <div class="card-hd">
            <div class="card-title-row">
              <h2>Profit &amp; loss</h2>
              <button class="export-btn" data-export="pnl" type="button" title="Download CSV">
                <i class="ph-duotone ph-download-simple"></i> CSV
              </button>
            </div>
            <div id="pnl-body">
              <div class="sk sk-line"></div>
              <div class="sk sk-line"></div>
              <div class="sk sk-line"></div>
            </div>
          </div>
        </div>

      </div><!-- /.row -->
    </div><!-- /.main -->
  </div><!-- /.app -->

  <!-- toast -->
  <div class="toast-msg" id="toast"><i class="ph-duotone ph-check-circle"></i><span id="toast-text">Done</span></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/reports.js"></script>
</body>
</html>
