<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Settings · HassDent Dental Supplies</title>
  <meta name="theme-color" content="#1a1a1c">
  <link rel="icon" type="image/png" href="img/favicon.png">
  <link rel="stylesheet" href="vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="vendor/phosphor/duotone.css">
  <link rel="stylesheet" href="vendor/phosphor/bold.css">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/shell.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/settings.css">
</head>
<body data-page="settings">
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation"></aside>
    <div class="sb-scrim" id="sb-scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-toggle" id="menu-toggle" type="button" aria-label="Open menu"><i class="ph-duotone ph-list"></i></button>
        <div class="title">
          <h1>Settings</h1>
          <div class="sub" id="greeting">&nbsp;</div>
        </div>
        <div class="actions">
          <button class="icon-btn" id="btn-refresh" type="button" title="Refresh"><i class="ph-duotone ph-arrows-clockwise"></i></button>
          <div class="dropdown">
            <button class="icon-btn" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false" aria-label="Notifications">
              <i class="ph-duotone ph-bell"></i><span class="dot" id="notif-dot" hidden>0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end notif-menu">
              <div class="notif-head"><b>Notifications</b><button type="button" id="notif-readall" hidden>Mark all as read</button></div>
              <div class="notif-list" id="notif-list"><div class="notif-empty">Loading…</div></div>
            </div>
          </div>
          <a class="btn-cta" href="pos.html" data-perm="sales.create">
            <span class="txt">New Sale</span><span class="plus"><i class="ph-bold ph-plus"></i></span>
          </a>
        </div>
      </header>

      <div class="row grid-gap">
        <div class="col-12 col-xl-7">
          <div class="card-hd form-card">
            <div class="card-title-row"><h2><i class="ph-duotone ph-storefront" style="margin-right:8px;"></i>Shop details</h2></div>
            <form id="shop-form" autocomplete="off">
              <div class="form-row">
                <div class="field" style="flex:2 1 260px;"><label for="shop_name">Shop name</label><input type="text" id="shop_name" maxlength="150"></div>
                <div class="field"><label for="currency">Currency</label><input type="text" id="currency" maxlength="3" style="text-transform:uppercase;"></div>
              </div>
              <div class="form-row">
                <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" maxlength="20"></div>
                <div class="field"><label for="email">Email</label><input type="email" id="email" maxlength="150"></div>
                <div class="field"><label for="kra_pin">KRA PIN</label><input type="text" id="kra_pin" maxlength="20"></div>
              </div>
              <div class="form-row"><div class="field" style="flex:3 1 320px;"><label for="address">Address</label><input type="text" id="address"></div></div>
              <div class="form-row"><div class="field" style="flex:3 1 320px;"><label for="receipt_footer">Receipt footer</label><textarea id="receipt_footer" rows="3" placeholder="Thank you message shown at the bottom of receipts"></textarea></div></div>
              <div class="form-actions">
                <button type="submit" class="btn-primary-custom" id="btn-save-shop" data-perm="settings.manage"><i class="ph-bold ph-check"></i> Save shop details</button>
              </div>
            </form>
          </div>
        </div>

        <div class="col-12 col-xl-5">
          <div class="card-hd form-card">
            <div class="card-title-row"><h2><i class="ph-duotone ph-seal-percent" style="margin-right:8px;"></i>Loyalty &amp; operations</h2></div>
            <form id="ops-form" autocomplete="off">
              <div class="form-row">
                <div class="field"><label for="loyalty_points_per_kes">Points per KES spent</label><input type="number" id="loyalty_points_per_kes" min="0" step="0.0001"><small class="hint">e.g. 0.01 = 1 point per KES 100</small></div>
                <div class="field"><label for="loyalty_kes_per_point">KES per point redeemed</label><input type="number" id="loyalty_kes_per_point" min="0" step="0.01"><small class="hint">e.g. 1.00 = 1 point = KES 1 off</small></div>
              </div>
              <div class="form-row">
                <div class="field"><label for="frequent_customer_min_visits">Frequent customer threshold</label><input type="number" id="frequent_customer_min_visits" min="1" step="1"><small class="hint">Visits needed to be flagged "frequent"</small></div>
                <div class="field"><label for="expiry_alert_days">Expiry alert (days)</label><input type="number" id="expiry_alert_days" min="1" step="1"><small class="hint">Warn this many days before a batch expires</small></div>
              </div>
              <div class="form-actions">
                <button type="submit" class="btn-primary-custom" id="btn-save-ops" data-perm="settings.manage"><i class="ph-bold ph-check"></i> Save operational settings</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="toast-msg" id="toast"><i class="ph-duotone ph-check-circle"></i><span id="toast-text">Saved</span></div>

  <script src="vendor/bootstrap/bootstrap.bundle.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/shell.js"></script>
  <script src="js/settings.js"></script>
</body>
</html>
